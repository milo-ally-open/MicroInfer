name: Release Go Gateway

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: gateway-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Gateway image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查版本 Tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must follow vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: 登录 GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: 构建并发布 Gateway 镜像
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/microinfer-gateway"
          short_sha="${GITHUB_SHA::12}"
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file deploy/docker/Dockerfile \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:sha-${short_sha}" \
            .
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:sha-${short_sha}"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "MicroInfer Gateway $GITHUB_REF_NAME"
