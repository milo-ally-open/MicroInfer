listener:
  host: 127.0.0.1
  port: 8000

# 配置为外部客户端可到达的 Gateway URL；TLS 可由前置 Proxy 终止。
public_base_url: http://127.0.0.1:8000

defaults:
  video_model: mage-vl-4b
  live_model: mage-vl-4b

upstream:
  base_url: http://127.0.0.1:8001
  max_idle_connections: 100
  max_idle_connections_per_host: 20
  idle_connection_seconds: 90
  tcp_keepalive_seconds: 30
  expect_continue_seconds: 1

# 对外别名与推理服务的模型 ID 分开保存。当前只登记已实现的模型。
models:
  mage-vl-4b:
    upstream_model: microsoft/Mage-VL
    base_url: http://127.0.0.1:8001
    capabilities:
      text_chat: false
      image_chat: true
      streaming: true
      tool_calling: false
      video_upload: true
      live_video: true
  qwen3-0.6b:
    upstream_model: qwen3-0.6b
    base_url: http://127.0.0.1:8011
    capabilities:
      text_chat: true
      image_chat: false
      streaming: true
      tool_calling: true
      video_upload: false
      live_video: false

limits:
  chat_request_bytes: 15728640
  video_request_bytes: 210763776
  live_request_bytes: 65536
  json_response_bytes: 20971520
  sse_event_bytes: 1048576
  max_header_bytes: 1048576
  stream_buffer_bytes: 32768

timeouts:
  connect_seconds: 10
  request_seconds: 300
  video_request_seconds: 900
  stream_idle_seconds: 60
  stream_max_seconds: 900
  readiness_seconds: 3
  read_header_seconds: 10
  idle_connection_seconds: 60
  shutdown_grace_seconds: 30

# 单执行个体 token bucket；Gateway 重启后计数重设。
rate_limit:
  requests_per_second: 5
  burst: 10

# 机密由程序环境指定文件路径或签章密钥，不写入此 YAML。
auth:
  api_keys_file_env: GATEWAY_API_KEYS_FILE

session:
  hmac_keys_env: GATEWAY_SESSION_HMAC_KEYS
  # 至少覆盖推理 live 工作会话最长时间；旧密钥需保留至签发句柄到期。
  handle_ttl_seconds: 3660

observability:
  log_level: info
  metrics_enabled: true
  metrics_path: /metrics
