listener:
  host: 0.0.0.0
  port: 8000

# 本机开发默认只经由 localhost 访问；有反向代理或远程客户端时，填写客户端实际使用的 URL。
public_base_url: http://localhost:8000

defaults:
  video_model: mage-vl-4b
  live_model: mage-vl-4b

# 容器通过 host.docker.internal 访问宿主机上运行的 Inference 服务。
upstream:
  base_url: http://host.docker.internal:8001
  max_idle_connections: 100
  max_idle_connections_per_host: 20
  idle_connection_seconds: 90
  tcp_keepalive_seconds: 30
  expect_continue_seconds: 1

models:
  mage-vl-4b:
    upstream_model: microsoft/Mage-VL
    base_url: http://host.docker.internal:8001
    capabilities:
      text_chat: false
      image_chat: true
      streaming: true
      tool_calling: false
      video_upload: true
      live_video: true
  qwen3-vl-2b:
    upstream_model: qwen3-vl-2b
    base_url: http://host.docker.internal:8012
    capabilities:
      text_chat: true
      image_chat: true
      streaming: true
      tool_calling: false
      video_upload: false
      live_video: false

limits:
  chat_request_bytes: 15728640
  video_request_bytes: 210763776
  live_request_bytes: 65536
  json_response_bytes: 20971520
  sse_event_bytes: 1048576
  max_header_bytes: 1048576
  stream_buffer_bytes: 32768

timeouts:
  connect_seconds: 10
  request_seconds: 300
  video_request_seconds: 900
  stream_idle_seconds: 60
  stream_max_seconds: 900
  readiness_seconds: 3
  read_header_seconds: 10
  idle_connection_seconds: 60
  shutdown_grace_seconds: 30

rate_limit:
  requests_per_second: 5
  burst: 10

auth:
  api_keys_file_env: GATEWAY_API_KEYS_FILE

session:
  hmac_keys_env: GATEWAY_SESSION_HMAC_KEYS
  handle_ttl_seconds: 3660

observability:
  log_level: info
  metrics_enabled: true
  metrics_path: /metrics
