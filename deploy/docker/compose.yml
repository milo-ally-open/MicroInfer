services:
  gateway:
    image: ${GATEWAY_IMAGE:-microinfer-gateway:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_API_KEYS_FILE: /run/secrets/api-keys.json
      GATEWAY_SESSION_HMAC_KEYS: ${GATEWAY_SESSION_HMAC_KEYS:?Set GATEWAY_SESSION_HMAC_KEYS in deploy/docker/.env}
    volumes:
      - ./gateway.yml:/etc/microinfer/gateway.yml:ro
      - ./secrets/api-keys.json:/run/secrets/api-keys.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
