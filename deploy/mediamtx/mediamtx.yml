logLevel: info
logDestinations: [stdout]

# MediaMTX 会先呼叫本机 Transformers API，通过授权后才允许推流端或读取端连线。
authMethod: http
authHTTPAddress: http://127.0.0.1:8001/v1/live/mediamtx/auth
authHTTPExclude: []

# RTSP/TCP 通常可通过主机防火墙，不必另外开放 RTP UDP 连接埠范围。
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554

# RTMP 可作为另一种推流协定。
rtmp: true
rtmpAddress: :1935

# 此部署只需要 RTSP／RTMP 输入，以及 API 透过 RTSP 读取串流。
hls: false
webrtc: false
srt: false
moq: false
playback: false
api: false
metrics: false
pprof: false

paths:
  all_others:

